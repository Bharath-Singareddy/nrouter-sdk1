# nRouter SDK & Provider Health Sentinel
# Continuously verifies all 10 SDKs and representative providers.
# Deploys status dashboard to GitHub Pages and emails health report to rama@nrouter.ai.
name: Sentinel

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sentinel run mode'
        required: true
        default: 'daily_canary'
        type: choice
        options:
          - daily_canary
          - full_matrix
          - mock_dry_run
      sdk:
        description: 'Target specific SDK (or "all")'
        required: false
        default: 'all'
      recipient:
        description: 'Email report recipient'
        required: false
        default: 'rama@nrouter.ai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sentinel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Phase 1 - Free Preflight & Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free Gateway Preflight & Cross-SDK Conformance
        env:
          NROUTER_BASE_URL: ${{ secrets.NROUTER_BASE_URL || 'https://api.nrouter.ai/v1' }}
          NROUTER_API_KEY: ${{ secrets.NROUTER_API_KEY }}
        run: |
          mkdir -p .scratch/preflight
          python3 scripts/sentinel_canary.py --preflight --output .scratch/preflight/sentinel-preflight.json

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-preflight
          path: .scratch/preflight/sentinel-preflight.json
          retention-days: 14

  canary-matrix:
    name: Canary - ${{ matrix.sdk }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: python
            runner: ubuntu-latest
          - sdk: js
            runner: ubuntu-latest
          - sdk: go
            runner: ubuntu-latest
          - sdk: rust
            runner: ubuntu-latest
          - sdk: java
            runner: ubuntu-latest
          - sdk: kotlin
            runner: ubuntu-latest
          - sdk: swift
            runner: ubuntu-latest
          - sdk: dart
            runner: ubuntu-latest
          - sdk: android
            runner: ubuntu-latest
          - sdk: r
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Canary Check
        env:
          NROUTER_BASE_URL: ${{ secrets.NROUTER_BASE_URL || 'https://api.nrouter.ai/v1' }}
          NROUTER_API_KEY: ${{ secrets.NROUTER_API_KEY }}
        run: |
          mkdir -p results
          MODE_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "mock_dry_run" ]; then
            MODE_FLAG="--mock"
          fi
          
          # If a single SDK was requested via workflow_dispatch, only execute if matching
          TARGET_SDK="${{ github.event.inputs.sdk || 'all' }}"
          if [ "$TARGET_SDK" != "all" ] && [ "$TARGET_SDK" != "${{ matrix.sdk }}" ]; then
            echo "Skipping ${{ matrix.sdk }} (dispatch targeted $TARGET_SDK)"
            python3 scripts/sentinel_canary.py --sdk ${{ matrix.sdk }} --mock --output "results/sentinel-result-${{ matrix.sdk }}.json"
          else
            python3 scripts/sentinel_canary.py --sdk ${{ matrix.sdk }} $MODE_FLAG --output "results/sentinel-result-${{ matrix.sdk }}.json"
          fi

      - name: Upload SDK Canary Result
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-result-${{ matrix.sdk }}
          path: results/sentinel-result-${{ matrix.sdk }}.json
          retention-days: 7

  aggregate-and-publish:
    name: Phase 3 - Aggregator, Dashboard & Email
    needs: [preflight, canary-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all canary results
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten and prepare results directory
        run: |
          mkdir -p results preflight dist
          find artifacts -name "sentinel-result-*.json" -exec cp {} results/ \;
          find artifacts -name "sentinel-preflight.json" -exec cp {} preflight/ \;
          echo "Discovered $(ls results/ | wc -l) canary result(s)"

      - name: Aggregate Results & Generate Dashboard
        run: |
          PREFLIGHT_ARG=""
          if [ -f preflight/sentinel-preflight.json ]; then
            PREFLIGHT_ARG="--preflight-file preflight/sentinel-preflight.json"
          fi
          python3 scripts/aggregate_sentinel.py \
            --results-dir results/ \
            $PREFLIGHT_ARG \
            --output-dir dist/ \
            --step-summary

      - name: Dispatch Daily Report Email to rama@nrouter.ai
        env:
          SENTINEL_EMAIL_RECIPIENT: ${{ github.event.inputs.recipient || 'rama@nrouter.ai' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTINEL_SMTP_HOST: ${{ secrets.SENTINEL_SMTP_HOST }}
          SENTINEL_SMTP_PORT: ${{ secrets.SENTINEL_SMTP_PORT }}
          SENTINEL_SMTP_USER: ${{ secrets.SENTINEL_SMTP_USER }}
          SENTINEL_SMTP_PASSWORD: ${{ secrets.SENTINEL_SMTP_PASSWORD }}
          SENTINEL_SMTP_FROM: ${{ secrets.SENTINEL_SMTP_FROM }}
          SENTINEL_SMTP_TLS: ${{ secrets.SENTINEL_SMTP_TLS }}
        run: |
          python3 scripts/send_sentinel_email.py \
            --report-file dist/sentinel-report.json \
            --preview-out dist/email_preview.html

      - name: Upload Sentinel Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-daily-report
          path: |
            dist/sentinel-report.json
            dist/sentinel-report.csv
            dist/index.html
            dist/email_preview.html
          retention-days: 30

      - name: Deploy to GitHub Pages (gh-pages branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP_DEPLOY=$(mktemp -d)
          git clone --branch gh-pages --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$TMP_DEPLOY"
          cp -r dist/* "$TMP_DEPLOY/"
          touch "$TMP_DEPLOY/.nojekyll"
          cd "$TMP_DEPLOY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "deploy: update Sentinel status dashboard [skip ci]"
            git push origin gh-pages
            echo "Successfully updated gh-pages branch"
          else
            echo "No changes to deploy to gh-pages"
          fi
          rm -rf "$TMP_DEPLOY"
