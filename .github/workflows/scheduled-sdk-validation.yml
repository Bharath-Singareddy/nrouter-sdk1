name: Scheduled SDK Validation

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      cadence:
        description: 'Probe count'
        required: true
        default: daily
        type: choice
        options: [daily, weekly]

permissions:
  contents: read

concurrency:
  group: scheduled-sdk-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Low-usage live SDK probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_SCHEDULED_ENDPOINTS: chat,messages,responses,completions,embeddings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - name: Install and build SDK
        working-directory: sdks/js
        run: npm ci && npm run build
      - name: Daily probe
        if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' || inputs.cadence == 'daily'
        working-directory: sdks/js
        run: node demo/scheduled-validation.mjs
      - name: Weekly probe
        if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0' || inputs.cadence == 'weekly'
        working-directory: sdks/js
        run: node demo/scheduled-validation.mjs --weekly
